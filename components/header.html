<!-- ================= HEADER V2 ================= -->
<header x-data="headerComponent" class="topbar topbar-v2">
  <div class="container topbar-inner topbar-v2-inner">
    <a href="index.html" class="brand brand-v2" aria-label="Carita Hidroponik Home">
      <img src="img/Logo-Putih.png" alt="Carita Hidroponik" class="brand-logo" />
      <span>Carita Hidroponik</span>
    </a>

    <nav class="nav-v2" aria-label="Navigasi utama">
      <a href="index.html#categories">Kategori</a>
      <a href="index.html#Product">Produk Pilihan</a>
      <a href="index.html#starter-bundle">Paket Pemula</a>
      <a href="index.html#guides">Panduan</a>
    </nav>

    <form class="header-search-v2" action="index.html#Product" role="search">
      <i data-feather="search"></i>
      <input name="q" type="search" placeholder="Cari produk..." aria-label="Cari produk" />
    </form>

    <div class="top-actions top-actions-v2">
      <a :href="profileLink" class="header-icon" aria-label="Account">
        <i data-feather="user"></i>
      </a>

      <a href="my-cart.html" class="header-icon icon-btn" aria-label="Cart">
        <i data-feather="shopping-cart"></i>
        <span id="cart-count"
              class="badge cart-count-badge"
              x-show="$store.cart.quantity > 0"
              x-text="$store.cart.quantity"></span>
      </a>

      <div id="language-switcher"
           x-data="{ open: false }"
           @click.away="open = false"
           class="lang-switcher">
        <button @click="open = !open"
                type="button"
                class="header-icon"
                :aria-label="'Current language: ' + $store.i18n.supportedLangs[$store.i18n.lang]">
          <img
            :src="$store.i18n.lang === 'en'
              ? 'https://cdn.jsdelivr.net/npm/flag-icons@latest/flags/1x1/gb.svg'
              : 'https://cdn.jsdelivr.net/npm/flag-icons@latest/flags/1x1/id.svg'"
            class="flag-icon"
            :alt="$store.i18n.supportedLangs[$store.i18n.lang]">
        </button>

        <div x-show="open" x-transition class="dropdown-content">
          <a href="#"
             @click.prevent="$store.i18n.setLang($store.i18n.lang === 'en' ? 'id' : 'en'); open = false"
             :aria-label="'Switch language to ' + $store.i18n.supportedLangs[$store.i18n.lang === 'en' ? 'id' : 'en']">
            <img
              :src="$store.i18n.lang === 'en'
                ? 'https://cdn.jsdelivr.net/npm/flag-icons@latest/flags/1x1/id.svg'
                : 'https://cdn.jsdelivr.net/npm/flag-icons@latest/flags/1x1/gb.svg'"
              class="flag-icon"
              :alt="$store.i18n.supportedLangs[$store.i18n.lang === 'en' ? 'id' : 'en']">
          </a>
        </div>
      </div>
    </div>
  </div>
</header>

<script>
  function headerComponent() {
    return {
      profileLink: 'https://itsrannn.github.io/Carita-Hidroponik/my-account.html',

      init() {
        const supabaseSessionKey = Object.keys(sessionStorage)
          .find(key => key.startsWith('sb-'));
        if (supabaseSessionKey) {
          this.profileLink = 'my-account.html';
        }
      }
    }
  }
</script>
